name: AirisPlanCapture
options:
  bundleIdPrefix: it.airismap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  AirisPlanCapture:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.airismap.airisplancapture
        PRODUCT_NAME: AirisPlanCapture
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: "NO"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: AirisPlan Rilievo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: "La fotocamera e il LiDAR servono per rilevare la stanza con RoomPlan."
        UIRequiredDeviceCapabilities: [arkit, arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
