name: iOS build (IPA non firmata)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versione Xcode
        run: xcodebuild -version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        working-directory: app
        run: xcodegen generate

      - name: Compila per iPhone (senza firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project app/AirisPlanCapture.xcodeproj \
            -scheme AirisPlanCapture \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|Compiling|Linking" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Impacchetta la IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AirisPlanCapture.app Payload/
          zip -qr AirisPlanCapture-unsigned.ipa Payload
          ls -la AirisPlanCapture-unsigned.ipa

      - name: Carica la IPA come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: AirisPlanCapture-ipa
          path: AirisPlanCapture-unsigned.ipa
          retention-days: 30

      - name: Carica il log di compilazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
